name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  # Note: this CI job only runs the unit tests, which use fakes for both
  # the browser fetch and the LLM call (see tests/test_agent.py) — no
  # ANTHROPIC_API_KEY, no `playwright install`, and no live network
  # access to any target site are required for CI to pass.
